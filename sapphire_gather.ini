; Sapphire gathering - F9 toggle (stand next to a Sapphire node, press F9 to start/stop)
; Written from memory without the Speeder MCP tools - NOT validated, NOT tested in game.
; 70 = F (interact key, assumed default). Change 70 everywhere if your interact key differs.
; keys4 = gather cast time in ms (min,max). Raise it if the gather gets cut off.

[120]
keys=eq % gInit,1|gt3
keys2=store % gInit,1|dbg % Sapphire gather ON
keys3=70d|rs40,90|70u
keys4=rs3200,3800
keys5=rs300,700
keys6=nop
endkeys=70u|store % gInit,0|dbg % Sapphire gather OFF
repeat=2
interrupt=2
